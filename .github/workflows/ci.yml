name: Homebrew formula

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  formula:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Link local tap and audit formula
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          brew tap MichaelWeissDEV/tap "$GITHUB_WORKSPACE"
          brew trust --formula MichaelWeissDEV/tap/refhound
          brew style MichaelWeissDEV/tap/refhound
          brew audit --formula MichaelWeissDEV/tap/refhound
      - name: Verify Homebrew Python (including pre-existing runner links)
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          set -euo pipefail
          printf 'Runner PATH: %s\n' "$PATH"
          # Do not replace the runner's existing idle3.13 or other Python links.
          brew install --skip-link python@3.13
          prefix=$(brew --prefix python@3.13)
          python_site="$prefix/lib/python3.13/site-packages"
          brew list --versions python@3.13
          if [ -e "$(brew --prefix)/bin/idle3.13" ]; then
            ls -ld "$(brew --prefix)/bin/idle3.13"
          else
            echo 'idle3.13 is not linked in the global Homebrew prefix'
          fi
          ls -ld "$prefix/bin/python3.13"
          test -f "$python_site/pip/__main__.py"
          PYTHONPATH="$python_site" BREW_PYTHON_PREFIX="$prefix" "$prefix/bin/python3.13" - <<'PY'
          import importlib.util
          import os
          import pip
          import sys
          print('executable:', sys.executable)
          print('sys.path:', sys.path)
          print('pip.__file__:', pip.__file__)
          print('pip spec:', importlib.util.find_spec('pip'))
          assert sys.executable.startswith(os.environ['BREW_PYTHON_PREFIX']), sys.executable
          assert pip.__file__.startswith(os.environ['BREW_PYTHON_PREFIX']), pip.__file__
          assert importlib.util.find_spec('pip.__main__'), 'Homebrew Python pip is incomplete'
          PY
          PYTHONPATH="$python_site" "$prefix/bin/python3.13" -m pip --version
      - name: Install and test
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          set -euo pipefail
          brew install --build-from-source MichaelWeissDEV/tap/refhound
          brew test MichaelWeissDEV/tap/refhound
          refhound --version
          refhound --help
          brew reinstall --build-from-source MichaelWeissDEV/tap/refhound
          brew test MichaelWeissDEV/tap/refhound
          brew uninstall MichaelWeissDEV/tap/refhound
          if command -v refhound; then
            echo 'refhound remains on PATH after uninstall' >&2
            exit 1
          fi
